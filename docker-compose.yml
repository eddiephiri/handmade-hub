services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_USER}
      POSTGRES_USER: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      - db
    environment:
      MIX_ENV: ${MIX_ENV}
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST}
      PHX_PORT: ${PHX_PORT}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAWAPAY_API_TOKEN: ${PAWAPAY_API_TOKEN}
      PAWAPAY_BASE_URL: ${PAWAPAY_BASE_URL}
      PAWAPAY_CALLBACK_URL: ${PAWAPAY_CALLBACK_URL}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    ports:
      - "${PHX_PORT}:${PHX_PORT}"
    volumes:
      - uploads_data:/app/priv/static/uploads
      - ./crash_dumps:/app/crash_dumps

volumes:
  db_data:
  uploads_data:


